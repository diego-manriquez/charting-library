<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charting Engine Playground</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #020617;
        color: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 35%),
          linear-gradient(180deg, #0f172a 0%, #020617 100%);
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #94a3b8;
      }

      #chart {
        width: 100%;
        height: 560px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      }

      .telemetry {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .telemetry-card {
        padding: 14px 16px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.72);
      }

      .telemetry-label {
        margin: 0 0 6px;
        font-size: 12px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .telemetry-value {
        margin: 0;
        font-size: 14px;
        color: #e2e8f0;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Charting Engine Playground</h1>
      <p>Manual test harness for the current candlestick MVP.</p>
      <div id="chart"></div>
      <section class="telemetry" aria-label="Chart events">
        <article class="telemetry-card">
          <p class="telemetry-label">Crosshair</p>
          <p id="crosshair-event" class="telemetry-value">Move over the chart</p>
        </article>
        <article class="telemetry-card">
          <p class="telemetry-label">Visible Range</p>
          <p id="visible-range-event" class="telemetry-value">Waiting for render</p>
        </article>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
