<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charting Engine Playground</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #020617;
        color: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 35%),
          linear-gradient(180deg, #0f172a 0%, #020617 100%);
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #94a3b8;
      }

      #chart {
        width: 100%;
        height: 560px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Charting Engine Playground</h1>
      <p>Manual test harness for the current candlestick MVP.</p>
      <div id="chart"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
